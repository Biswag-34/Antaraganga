<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 180 600" preserveAspectRatio="xMidYMid meet"><style>.pulse{animation:pulse 6s ease-in-out infinite}.flow{stroke-dasharray:8 12;animation:flow 12s linear infinite}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.7}}@keyframes flow{to{stroke-dashoffset:-160}}@media(prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}</style><path d="M90 60V540" stroke="#087F8C" stroke-width="3" fill="none" class="flow"/><circle cx="90" cy="60" r="36" fill="#EAF5F7"/><circle class="pulse" cx="90" cy="60" r="46" fill="none" stroke="#087F8C" stroke-width="2"/><circle cx="90" cy="60" r="7" fill="#087F8C"/><circle cx="90" cy="300" r="36" fill="#EAF5F7"/><circle class="pulse" cx="90" cy="300" r="46" fill="none" stroke="#087F8C" stroke-width="2"/><circle cx="90" cy="300" r="7" fill="#087F8C"/><circle cx="90" cy="540" r="36" fill="#EAF5F7"/><circle class="pulse" cx="90" cy="540" r="46" fill="none" stroke="#087F8C" stroke-width="2"/><circle cx="90" cy="540" r="7" fill="#087F8C"/></svg>